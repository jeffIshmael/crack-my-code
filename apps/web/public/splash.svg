<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400" fill="none">
  <defs>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2F6FD6"/>
      <stop offset="100%" stop-color="#4ECDC4"/>
    </linearGradient>
    <filter id="titleShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="0" flood-color="#C5DFF0"/>
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="rgba(43,108,176,0.18)"/>
    </filter>
    <filter id="tileShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="0" flood-color="#C5DFF0"/>
    </filter>
  </defs>

  <!-- Guess row: yellow · green · absent · green -->
  <g transform="translate(76 108)" filter="url(#tileShadow)">
    <rect x="0" y="0" width="56" height="56" rx="14" fill="#FF9F43"/>
    <text x="28" y="38" text-anchor="middle" font-family="Fredoka, Arial Rounded MT Bold, sans-serif" font-size="28" font-weight="700" fill="#FFFFFF">3</text>

    <rect x="64" y="0" width="56" height="56" rx="14" fill="#58C76E"/>
    <text x="92" y="38" text-anchor="middle" font-family="Fredoka, Arial Rounded MT Bold, sans-serif" font-size="28" font-weight="700" fill="#FFFFFF">7</text>

    <rect x="128" y="0" width="56" height="56" rx="14" fill="#FFFFFF" stroke="#B8D9EE" stroke-width="2"/>
    <text x="156" y="38" text-anchor="middle" font-family="Fredoka, Arial Rounded MT Bold, sans-serif" font-size="28" font-weight="700" fill="#6B8CAE">1</text>

    <rect x="192" y="0" width="56" height="56" rx="14" fill="#58C76E"/>
    <text x="220" y="38" text-anchor="middle" font-family="Fredoka, Arial Rounded MT Bold, sans-serif" font-size="28" font-weight="700" fill="#FFFFFF">9</text>
  </g>

  <!-- Gamy title -->
  <text x="200" y="268" text-anchor="middle" font-family="Fredoka, Arial Rounded MT Bold, sans-serif" font-size="34" font-weight="700" fill="url(#titleGrad)" filter="url(#titleShadow)" letter-spacing="1">CRACK MY CODE</text>
  <text x="200" y="302" text-anchor="middle" font-family="Nunito, sans-serif" font-size="14" font-weight="700" fill="#6B8CAE" letter-spacing="3">GUESS · DECODE · WIN</text>
</svg>
