<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <rect width="512" height="512" fill="#E3F2FA"/>

  <defs>
    <style>
      @font-face {
        font-family: 'Caveat';
        src: url('./fonts/Caveat.ttf') format('truetype');
        font-weight: 600 700;
      }
    </style>
    <filter id="tileShadow" x="-15%" y="-15%" width="130%" height="145%">
      <feDropShadow dx="0" dy="5" stdDeviation="0" flood-color="#A8CCE0"/>
    </filter>
  </defs>

  <g transform="translate(44 52)" filter="url(#tileShadow)">
    <rect x="0" y="0" width="100" height="100" rx="22" fill="#FF9F43"/>
    <text x="50" y="68" text-anchor="middle" font-family="Arial Rounded MT Bold, Helvetica Rounded, sans-serif" font-size="52" font-weight="700" fill="#FFFFFF">3</text>

    <rect x="112" y="0" width="100" height="100" rx="22" fill="#58C76E"/>
    <text x="162" y="68" text-anchor="middle" font-family="Arial Rounded MT Bold, Helvetica Rounded, sans-serif" font-size="52" font-weight="700" fill="#FFFFFF">7</text>

    <rect x="224" y="0" width="100" height="100" rx="22" fill="#FFFFFF" stroke="#B8D9EE" stroke-width="3"/>
    <text x="274" y="68" text-anchor="middle" font-family="Arial Rounded MT Bold, Helvetica Rounded, sans-serif" font-size="52" font-weight="700" fill="#6B8CAE">1</text>

    <rect x="336" y="0" width="100" height="100" rx="22" fill="#58C76E"/>
    <text x="386" y="68" text-anchor="middle" font-family="Arial Rounded MT Bold, Helvetica Rounded, sans-serif" font-size="52" font-weight="700" fill="#FFFFFF">9</text>
  </g>

  <text
    x="256"
    y="262"
    text-anchor="middle"
    font-family="Caveat, Bradley Hand, Chalkboard SE, cursive"
    font-size="76"
    font-weight="700"
    fill="#2F6FD6"
  >Crack My Code</text>
</svg>
